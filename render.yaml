services:
  - type: web
    name: delta-orb-signal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: BOT_MODULE
        value: ORB
      - key: SCANNER_SYMBOL_LIMIT
        value: "40"
      - key: SHADOW_ML_ENABLED
        value: "false"
      - key: SIGNAL_ONLY
        value: "true"
      - key: ORDERS_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
